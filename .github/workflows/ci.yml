name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (dengan riwayat untuk diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check JS (node --check)
        run: |
          set -e
          for f in sw.js js/app.js js/logger.js; do
            if [ -f "$f" ]; then
              echo "check: $f"
              node --check "$f"
            else
              echo "lewati (tidak ada): $f"
            fi
          done
          echo "Lolos node --check."

      - name: Cek sw.js punya nama cache valid
        run: |
          if [ -f sw.js ]; then
            grep -qE 'CACHE[[:space:]]*=[[:space:]]*"pnw-tools-v[0-9]+"' sw.js \
              || { echo "::error::sw.js tidak punya nama cache pnw-tools-vN yang valid"; exit 1; }
            echo "sw.js cache: $(grep -oE 'pnw-tools-v[0-9]+' sw.js | head -1)"
          else
            echo "sw.js tidak ada, lewati."
          fi

      - name: Wajib bump cache sw.js bila aset berubah
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Tidak ada commit pembanding, cek bump dilewati."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "File berubah:"; echo "$CHANGED"
          ASSETS=$(echo "$CHANGED" | grep -E '^(index\.html|sw\.js|css/|js/)' || true)
          if [ -z "$ASSETS" ]; then
            echo "Tidak ada aset front-end berubah, cek bump dilewati."
            exit 0
          fi
          if ! echo "$CHANGED" | grep -qx 'sw.js'; then
            echo "::error::Aset berubah tapi sw.js tidak ikut berubah. Wajib bump nama cache di sw.js baris 4."
            exit 1
          fi
          OLD=$(git show "${BEFORE}:sw.js" 2>/dev/null | grep -oE 'pnw-tools-v[0-9]+' | head -1 || true)
          NEW=$(grep -oE 'pnw-tools-v[0-9]+' sw.js | head -1 || true)
          echo "cache lama=$OLD baru=$NEW"
          if [ -n "$OLD" ] && [ "$OLD" = "$NEW" ]; then
            echo "::error::Nama cache sw.js belum di-bump ($OLD). Naikkan versinya tiap rilis."
            exit 1
          fi
          echo "OK: cache di-bump $OLD -> $NEW"
